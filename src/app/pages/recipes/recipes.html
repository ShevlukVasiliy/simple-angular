<app-base-layout>
  <div class="container">
    <h1>Все рецепты на платформе</h1>
    <div class='recipes'>
    @if (recipes().length === 0) {
      <p>Загрузка...</p>
    } @else {
      @for (recipe of recipes(); track recipe.id) {
        <app-recipe-card [recipe]='recipe'></app-recipe-card>
      }
    }
    </div>
  </div>
</app-base-layout>
