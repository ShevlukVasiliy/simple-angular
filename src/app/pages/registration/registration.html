<app-base-layout>
  <div class="container">
    <h1>
      Зарегистрируйте ваш аккаунт
    </h1>
    <div class="form-container">
      <form class='form' [formGroup]="form">

        <div class='form-field'>
          <label for='login'>Логин</label>
          <div class="input-wrapper">
            <input formControlName='login' id='login' [ngClass]='{"error": form.get("login")?.invalid && form.get("login")?.touched}' />
            <svg class='exl-mark' [ngClass]='{"hide": form.get("login")?.valid || !form.get("login")?.touched}' width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10ZM11 14C11 14.5523 10.5523 15 10 15C9.44772 15 9 14.5523 9 14C9 13.4477 9.44772 13 10 13C10.5523 13 11 13.4477 11 14ZM10 5C9.44772 5 9 5.44772 9 6V10C9 10.5523 9.44772 11 10 11C10.5523 11 11 10.5523 11 10V6C11 5.44772 10.5523 5 10 5Z" fill="#EF4444"/>
            </svg>
          </div>
        </div>

        <div class='form-field'>
          <label for='password'>Пароль</label>
          <div class="input-wrapper">
            <input type="password" formControlName='password' id='password' [ngClass]='{"error": form.get("password")?.invalid && form.get("password")?.touched}' />
            <svg class='exl-mark' [ngClass]='{"hide": form.get("password")?.valid || !form.get("password")?.touched}' width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10ZM11 14C11 14.5523 10.5523 15 10 15C9.44772 15 9 14.5523 9 14C9 13.4477 9.44772 13 10 13C10.5523 13 11 13.4477 11 14ZM10 5C9.44772 5 9 5.44772 9 6V10C9 10.5523 9.44772 11 10 11C10.5523 11 11 10.5523 11 10V6C11 5.44772 10.5523 5 10 5Z" fill="#EF4444"/>
            </svg>
          </div>
        </div>

        <div class='form-field'>
          <label for='firstName'>Имя</label>
          <div class="input-wrapper">
            <input formControlName='firstName' id='firstName' [ngClass]='{"error": form.get("firstName")?.invalid && form.get("firstName")?.touched}' />
            <svg class='exl-mark' [ngClass]='{"hide": form.get("firstName")?.valid || !form.get("firstName")?.touched}' width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10ZM11 14C11 14.5523 10.5523 15 10 15C9.44772 15 9 14.5523 9 14C9 13.4477 9.44772 13 10 13C10.5523 13 11 13.4477 11 14ZM10 5C9.44772 5 9 5.44772 9 6V10C9 10.5523 9.44772 11 10 11C10.5523 11 11 10.5523 11 10V6C11 5.44772 10.5523 5 10 5Z" fill="#EF4444"/>
            </svg>
          </div>
        </div>

        <div class='form-field'>
          <label for='lastName'>Фамилия</label>
          <div class="input-wrapper">
            <input formControlName='lastName' id='lastName' [ngClass]='{"error": form.get("lastName")?.invalid && form.get("lastName")?.touched}' />
            <svg class='exl-mark' [ngClass]='{"hide": form.get("lastName")?.valid || !form.get("lastName")?.touched}' width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10ZM11 14C11 14.5523 10.5523 15 10 15C9.44772 15 9 14.5523 9 14C9 13.4477 9.44772 13 10 13C10.5523 13 11 13.4477 11 14ZM10 5C9.44772 5 9 5.44772 9 6V10C9 10.5523 9.44772 11 10 11C10.5523 11 11 10.5523 11 10V6C11 5.44772 10.5523 5 10 5Z" fill="#EF4444"/>
            </svg>
          </div>
        </div>

        <div class='form-field'>
          <label for='middleName'>Отчество (при наличии)</label>
          <div class="input-wrapper">
            <input formControlName='middleName' id='middleName' [ngClass]='{"error": form.get("middleName")?.invalid && form.get("middleName")?.touched}' />
          </div>
        </div>

        <button (click)='submit()' [disabled]='form.invalid' type='button' class='submit-button'>Зарегистрироваться</button>
      </form>
    </div>
  </div>
</app-base-layout>
