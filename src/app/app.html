<h1>1.3</h1>

<h2>show array using interpolation</h2>
<div>
  @if (array.length > 0) {
    <ul>
      @for (row of array; track $index) {
        <li>{{row}}</li>
      } @empty {
        <p>empty array</p>
      }
    </ul>
  }
</div>

<h2>date using date pipe</h2>
<p>{{date | date:'dd.MM.yyyy'}}</p>

<h2>date using date pipe</h2>
<p>{{number | plus_five }}</p>
