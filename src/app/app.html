<header class='border-b-blue-400 border-2 border-transparent'>
  <nav class='flex justify-between'>
    <div class='flex gap-x-2'>
      <a routerLink="/">home</a>
      <a routerLink="/posts">posts</a>
    </div>
    @if (isAccessed()) {
      <button [disabled]='!user.canChangeRole()' (click)='user.toggleRole()' class='disabled:text-neutral-600'>
        Сменить роль на @if (user.role() === 'user') {
            Администратора
          } @else {
            Пользователя
          }
      </button>

    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
