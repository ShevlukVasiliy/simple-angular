<section class='flex flex-col gap-y-1'>
  <h1>Список постов</h1>

  @if (isLoading()) {
    <p>
      Загрузка
    </p>
  }

  @if (hasError()) {
    <p>
      При загрузке постов возникла ошибка.
    </p>
    <button>
      Попробовать снова
    </button>
  }

  @if (posts().length > 0 && hasError() === false && isLoading() === false) {
    @for (post of posts(); track post) {
    <a [routerLink]='post.id + ""'>{{post.id}}. {{post.title}}</a>
    }
  }
</section>
