<div class='food-value'>
  <h3>Пищевая ценность</h3>
  <div class='rows'>
    <div class='row'>
      <span>Калории</span>
      <b>{{foodValue.calories}} ккал</b>
    </div>
    <div class='row'>
      <span>Жиры</span>
      <b>{{foodValue.fats}} г</b>
    </div>
    <div class='row'>
      <span>Углеводы</span>
      <b>{{foodValue.carbohydrates}} г</b>
    </div>
    <div class='row'>
      <span>Белки</span>
      <b>{{foodValue.proteins}} г</b>
    </div>
  </div>
  <p class='note'>Значения приблизительные</p>
</div>
