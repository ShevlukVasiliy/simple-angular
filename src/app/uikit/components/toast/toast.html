<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-card" [ngClass]="[toast.type, toast.leaving ? 'leaving' : '']">
      <div class="toast-icon-wrapper">
        @switch (toast.type) {
          @case ('success') {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="10" stroke="#10B981" stroke-width="2" />
              <path
                d="M8 12L11 15L16 9"
                stroke="#10B981"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          }
          @case ('error') {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="10" stroke="#EF4444" stroke-width="2" />
              <path
                d="M12 8V12M12 16H12.01"
                stroke="#EF4444"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          }
          @default {
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="10" stroke="#3A3395" stroke-width="2" />
              <path
                d="M12 16V12M12 8H12.01"
                stroke="#3A3395"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          }
        }
      </div>

      <div class="toast-body">
        <div class="toast-title">{{ toast.title }}</div>
        @if (toast.description) {
          <div class="toast-desc">{{ toast.description }}</div>
        }
      </div>

      <button type="button" class="toast-close-btn" (click)="close(toast.id)">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#9CA3AF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }
</div>
