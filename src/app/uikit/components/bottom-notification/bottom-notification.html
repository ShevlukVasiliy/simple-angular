@if (!isClosed()) {
  <div class="bottom-notification">
    <p class="text">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M3 11V13C3 13.5523 3.44772 14 4 14H6L9 19C9.55228 19 10 18.5523 10 18V6C10 5.44772 9.55228 5 9 5L6 10H4C3.44772 10 3 10.4477 3 11Z"
          stroke="white"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          d="M14 9C15 10 15 14 14 15"
          stroke="white"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <path d="M17 6C19 8 19 16 17 18" stroke="white" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      Хорошие новости! Мы открыли наш интернет-магазин
    </p>

    <button type="button" class="close" (click)="close()" aria-label="Закрыть оповещение">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
}
